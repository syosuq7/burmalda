name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir -p www && cp index.html www/
      - run: npm install --legacy-peer-deps
      - run: npx cap add android
      - name: Permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: System bars in app color, UI sits between them
        run: |
          cat > android/app/src/main/java/com/nicever/multillm/MainActivity.java <<'EOF'
          package com.nicever.multillm;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().getDecorView().setBackgroundColor(Color.parseColor("#1a1a1a"));
                  getWindow().setStatusBarColor(Color.parseColor("#1a1a1a"));
                  getWindow().setNavigationBarColor(Color.parseColor("#1a1a1a"));
                  WindowInsetsControllerCompat c =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.setAppearanceLightStatusBars(false);
                  c.setAppearanceLightNavigationBars(false);
                  final View content = findViewById(android.R.id.content);
                  ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                      Insets bars = insets.getInsets(
                          WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                      Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                      v.setPadding(bars.left, bars.top, bars.right, Math.max(bars.bottom, ime.bottom));
                      return WindowInsetsCompat.CONSUMED;
                  });
              }
          }
          EOF
      - run: npx cap sync android
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
